name: ci

on:
  push:
    branches: [main, develop, master]
  pull_request:

jobs:
  ci:
    # `runs-on: ubuntu-latest` is a GitHub-hosted runner. Replacing it with `runs-on: self-hosted`
    # is the only change a self-hosted runner needs: the step below is the same command a developer
    # runs locally, so there is no second pipeline to port.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # There is no setup-node step and no install step. Node and everything else the pipeline needs
      # come from the CI image built by ci/Dockerfile, which is the same image a developer gets
      # locally. A `setup-node` here would mean GitHub tests against one Node and the developer
      # against another, which is exactly the drift this arrangement removes.
      #
      # The pipeline itself — which checks run, in what order, and why — is defined once, in
      # ci/pipeline.mjs. This workflow does not restate it. If you find yourself adding a step here
      # that runs a check, add it to ci/pipeline.mjs instead, or the local run and this run stop
      # meaning the same thing.
      - name: Local CI pipeline (Docker)
        run: ./scripts/ci.sh

      # Kept for a failed run: the machine-readable record names the check that failed and how long
      # each one took. Uploading it is not part of the gate — the gate is the step above.
      - name: Upload CI result record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ci-result
          path: artifacts/local-ci/latest.json
          if-no-files-found: ignore
