# Project policy for the InnovationStandards repository itself.
#
# This is the dogfooded instance, and therefore the pattern every adopting project will copy —
# including its mistakes. Four rules govern what may appear here:
#
#   * Rule IDs are canonical only. No camelCase; the schema rejects it.
#   * `applicability` and `exceptions` are different mechanisms and never substitute for each other.
#       not-applicable = the rule has no subject in this project.
#       exception      = the rule applies and this project knowingly does not satisfy it.
#   * An attestation is EVIDENCE, not a waiver. It never overrides an automated finding.
#   * Nothing here asserts compliance. What this project actually meets is a validation result.
#
# Note what this policy does NOT contain: any level below the catalog's for an invariant-class rule.
# Such a declaration would be reported by innovation.integrity-invariant and would be refused by the
# evaluator anyway (ADR 0005). A prohibition a project can switch off is not a prohibition.
#
# Shape: schemas/project-policy.schema.json. Meaning: the standards in standards/.

standardVersion: "1.0.0"
project: "InnovationStandards"

rules:
  innovation.proposal-artifact:
    level: required
  innovation.problem-statement:
    level: required
  innovation.no-problem-no-build:
    level: forbidden
  innovation.evidence-labels:
    level: required
  innovation.evidence-citations:
    level: required
  innovation.no-silent-upgrade:
    level: forbidden
  innovation.no-fabricated-evidence:
    level: forbidden
  innovation.assumptions-declared:
    level: required
  innovation.novelty-not-value:
    level: forbidden
  innovation.existing-capability-analysis:
    level: required
  innovation.alternatives-considered:
    level: required
  innovation.value-articulation:
    level: required
  innovation.cost-accounting:
    level: required
  innovation.no-hidden-costs:
    level: forbidden
  innovation.security-privacy-review:
    level: required
  innovation.standards-non-bypass:
    level: forbidden
  innovation.scope-baseline:
    level: required
  innovation.mvp-definition:
    level: required
  innovation.no-silent-scope-change:
    level: forbidden
  innovation.success-criteria:
    level: required
  innovation.kill-criteria:
    level: required
  innovation.no-sunk-cost-continuation:
    level: forbidden
  innovation.experiment-before-build:
    level: recommended
  innovation.decision-recorded:
    level: required
  innovation.revisit-conditions:
    level: required
  innovation.brainstorm-not-roadmap:
    level: forbidden
  innovation.portfolio-overlap:
    level: required
  innovation.prioritization-discipline:
    level: forbidden
  innovation.new-project-justification:
    level: required
  innovation.integrity-invariant:
    level: forbidden

# There is deliberately no `applicability:` block. Every rule's subject exists here: this repository
# records real innovation proposals and is evaluated against them, so no rule is declared
# not-applicable. A not-applicable declaration is a claim about THIS PROJECT rather than about the
# rule, it stops being true the moment the project changes, and the mechanism therefore demands a
# reason, a review date, and a revisit condition. Declaring one without a genuine subject-absence
# would be using applicability as a quiet exception, which is exactly what the two mechanisms are
# kept separate to prevent.
#
# (An empty `applicability: {}` is not written here because scripts/yaml.mjs rejects flow mappings
# rather than guessing at them — the parser failing loudly is the design working.)

# No exceptions. Every rule that applies here is either met, failing, or honestly unevaluated, and a
# failing rule is reported as a failure rather than waived.
exceptions: []

# ---------------------------------------------------------------------------------------------
# ATTESTATIONS — all four LAPSED on 2026-08-09, and deliberately not renewed.
# ---------------------------------------------------------------------------------------------
#
# Four of the eight manual-review rules were attested at v1.0.1 against proposals 0001–0003:
# no-fabricated-evidence, no-hidden-costs, novelty-not-value, no-sunk-cost-continuation. Their full
# text — reviewer, date, evidence, reviewed paths and digest — is preserved verbatim in git history
# at tag v1.0.1 and can be restored from there.
#
# Two things invalidated them on the same day, and it is worth recording that BOTH mechanisms fired
# rather than only the one that was designed for this:
#
#   Content freshness.  Proposal 0003 was materially revised — its RevisitWhen fired, five evidence
#                       entries were added, and a revision entry was written. The recorded digest
#                       stopped matching, so the evaluator lapsed all four automatically and the
#                       eight manual-review rules returned to not-evaluated without anyone acting.
#
#   Coverage freshness. Proposals 0004 and 0005 were added. `reviewedAgainst.paths` named neither,
#                       so each attestation covered three of five proposals while reading as though
#                       it covered the repository. A test in test/audit.test.mjs reports exactly
#                       this, and it is the reason these entries were removed rather than left to
#                       lapse quietly.
#
# THEY ARE NOT RENEWED, and the reason is the point of the mechanism. Renewing them means a human
# re-reading all five proposals against all four rules and writing what was actually examined. The
# proposals that broke coverage — 0004 and 0005 — were written by the same party that would be
# renewing, and an author attesting to their own work is an assertion wearing the costume of a
# review. The cheap move was available and is exactly what the v1.0.1 comment here warned against:
# extend the path list, recompute the digest, leave the evidence text alone. That would have
# restored a green line to the verdict and established nothing.
#
# What the verdict says instead is `not-evaluated` against eight rules, with the words "Nothing
# examined these. That is not a pass — it is the absence of a result." That is the true state.
#
# To renew: review all five proposals against the four rules, restore the entries from v1.0.1,
# rewrite each `evidence` line to describe what was actually examined in 0004 and 0005, extend
# `reviewedAgainst.paths` to all five, and let `standards validate` print the new digest.
#
# The other four manual-review rules were never attested and still should not be: this repository
# has no portfolio to judge prioritization against, no roadmap presentation to inspect, no external
# standards regime to bypass, and no revision history of a release objective to compare.
